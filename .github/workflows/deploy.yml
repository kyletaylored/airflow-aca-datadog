name: Deploy

# Deploys merged changes to the Azure resource group. Off until the repository
# variable AZURE_DEPLOY_ENABLED is "true"; setup is in the README's
# "Continuous deployment" section.
#
#   infra/**, azure.yaml          -> azd provision (Bicep, then the DAG upload hook)
#   airflow/dags, airflow/plugins -> DAG and plugin upload only
#   airflow/plugins               -> also restart the Airflow apps that load plugins
#   services/**                   -> the same upload, then restart the stream services
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "azure.yaml"
      - "airflow/dags/**"
      - "airflow/plugins/**"
      - "scripts/upload-dags.sh"
      - "services/**"
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        type: choice
        options: [dags, infra]
        default: dags

permissions:
  contents: read

# One deploy at a time; a queued one waits rather than cancelling a provision.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to 26.04
    outputs:
      target: ${{ steps.plan.outputs.target }}
      services_changed: ${{ steps.plan.outputs.services_changed }}
      plugins_changed: ${{ steps.plan.outputs.plugins_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what to deploy
        id: plan
        env:
          ENABLED: ${{ vars.AZURE_DEPLOY_ENABLED }}
          EVENT: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "::notice::Deploy is off. Set the repository variable AZURE_DEPLOY_ENABLED=true to turn it on."
            echo "target=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            target="$INPUT_TARGET"
            # No diff to go on, and the plugins may have changed since the last deploy.
            echo "plugins_changed=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # New branch or force push: no reliable diff, so deploy everything.
            target=infra
            echo "plugins_changed=true" >> "$GITHUB_OUTPUT"
          else
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            if printf '%s\n' "$changed" | grep -qE '^services/'; then
              echo "services_changed=true" >> "$GITHUB_OUTPUT"
            fi
            if printf '%s\n' "$changed" | grep -qE '^airflow/plugins/'; then
              echo "plugins_changed=true" >> "$GITHUB_OUTPUT"
            fi
            if printf '%s\n' "$changed" | grep -qE '^(infra/|azure\.yaml$)'; then
              target=infra
            elif printf '%s\n' "$changed" | grep -qE '^(airflow/(dags|plugins)/|scripts/upload-dags\.sh$|services/)'; then
              target=dags
            else
              target=none
            fi
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Deploy target: \`$target\`" >> "$GITHUB_STEP_SUMMARY"

  # The CI checks again, against the merged commit. Deploy waits for them and
  # doesn't run if they fail.
  ci:
    needs: plan
    if: needs.plan.outputs.target == 'infra' || needs.plan.outputs.target == 'dags'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [plan, ci]
    if: needs.plan.outputs.target == 'infra' || needs.plan.outputs.target == 'dags'
    runs-on: ubuntu-24.04
    # Holds the Azure identity, the azd settings and the secrets. Add required
    # reviewers to it to approve each deploy.
    environment: azure
    permissions:
      contents: read
      id-token: write  # OIDC token for the federated credential
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/setup-azd@v2.4.0

      - name: Log azd in with the same identity
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --tenant-id "$AZURE_TENANT_ID" \
            --federated-credential-provider github

      - name: ${{ needs.plan.outputs.target == 'infra' && 'Provision (Bicep and DAG upload)' || 'Upload DAGs and plugins' }}
        env:
          TARGET: ${{ needs.plan.outputs.target }}
          # Both paths need every parameter: azd env refresh resolves the whole
          # parameter file even though it only reads the deployment's outputs.
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          AIRFLOW_ADMIN_PASSWORD: ${{ secrets.AIRFLOW_ADMIN_PASSWORD }}
          AIRFLOW_SECRET_KEY: ${{ secrets.AIRFLOW_SECRET_KEY }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          # Optional demo data pipeline (docs/data-pipeline-demo.md).
          DD_POSTGRES_PASSWORD: ${{ secrets.DD_POSTGRES_PASSWORD }}
          ENABLE_DATA_PIPELINE: ${{ vars.ENABLE_DATA_PIPELINE }}
          ENABLE_ORDER_STREAM: ${{ vars.ENABLE_ORDER_STREAM }}
          ENABLE_METABASE: ${{ vars.ENABLE_METABASE }}
          METABASE_DB_PASSWORD: ${{ secrets.METABASE_DB_PASSWORD }}
          # The pipeline identity can't assign roles; the role from the first
          # deploy stays in place.
          ASSIGN_JOBS_ROLE: ${{ vars.ASSIGN_JOBS_ROLE || 'false' }}
          DD_SITE: ${{ vars.DD_SITE }}
          DD_ENV: ${{ vars.DD_ENV }}
          DEMO_DAG_SCHEDULE: ${{ vars.DEMO_DAG_SCHEDULE }}
          RESOURCE_TAGS: ${{ vars.RESOURCE_TAGS }}
          TELEMETRY_SIGNALS: ${{ vars.TELEMETRY_SIGNALS }}
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          POSTGRES_LOCATION: ${{ vars.POSTGRES_LOCATION }}
          POSTGRES_ZONE: ${{ vars.POSTGRES_ZONE }}
          POSTGRES_SKU_NAME: ${{ vars.POSTGRES_SKU_NAME }}
          POSTGRES_SKU_TIER: ${{ vars.POSTGRES_SKU_TIER }}
          POSTGRES_MAX_CONNECTIONS: ${{ vars.POSTGRES_MAX_CONNECTIONS }}
          # Datadog Source Code Integration: tagged on every service's telemetry.
          GIT_REPOSITORY_URL: github.com/${{ github.repository }}
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          # A changed password or secret key would lock Airflow out of its own
          # database and sessions, and an empty DD_API_KEY turns Datadog off.
          for name in POSTGRES_ADMIN_PASSWORD AIRFLOW_ADMIN_PASSWORD AIRFLOW_SECRET_KEY DD_API_KEY; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::Secret $name is not set on the 'azure' environment."
              exit 1
            fi
          done
          # Without its password the pipeline would quietly switch off and drop its
          # settings from the Airflow apps.
          if [ "$ENABLE_DATA_PIPELINE" = "true" ] && [ -z "$DD_POSTGRES_PASSWORD" ]; then
            echo "::error::ENABLE_DATA_PIPELINE is true but secret DD_POSTGRES_PASSWORD is not set on the 'azure' environment."
            exit 1
          fi
          if [ "$ENABLE_METABASE" = "true" ] && [ -z "$METABASE_DB_PASSWORD" ]; then
            echo "::error::ENABLE_METABASE is true but secret METABASE_DB_PASSWORD is not set on the 'azure' environment."
            exit 1
          fi
          # An unset GitHub variable arrives as an empty string. Drop those so
          # the parameter file's ${NAME=default} values apply.
          for name in DD_SITE DD_ENV DEMO_DAG_SCHEDULE RESOURCE_TAGS TELEMETRY_SIGNALS NAME_PREFIX POSTGRES_LOCATION POSTGRES_ZONE POSTGRES_SKU_NAME POSTGRES_SKU_TIER POSTGRES_MAX_CONNECTIONS ENABLE_DATA_PIPELINE DD_POSTGRES_PASSWORD ENABLE_ORDER_STREAM ENABLE_METABASE METABASE_DB_PASSWORD; do
            eval "value=\${$name}"
            [ -n "$value" ] || unset "$name"
          done

          if [ "$TARGET" = "infra" ]; then
            azd provision --no-prompt
          else
            # Load the deployment's outputs (storage account, share name) into
            # the azd environment, then run the hook azd provision runs.
            azd env refresh --no-prompt
            azd hooks run postprovision --no-prompt
          fi

      - name: Restart Postgres if a server setting is waiting for it
        # Some settings (Database Monitoring's track_activity_query_size and
        # pg_stat_statements.max) only apply after a restart, which Bicep
        # doesn't do. Airflow loses its database for a minute or two, once.
        if: needs.plan.outputs.target == 'infra'
        run: |
          set -o pipefail
          # azd keeps Bicep outputs under their camelCase names.
          server="$(azd env get-value postgresServerName)"
          pending="$(az postgres flexible-server parameter list -g "$AZURE_RESOURCE_GROUP" -s "$server" \
            --query "[?isConfigPendingRestart].name" -o tsv | tr '\n' ' ')"
          if [ -z "$pending" ]; then
            echo "No setting on $server is waiting for a restart."
            exit 0
          fi
          echo "Restarting $server for: $pending"
          az postgres flexible-server restart -g "$AZURE_RESOURCE_GROUP" -n "$server" -o none

      - name: Restart the Airflow apps that load plugins
        # They import the plugins folder (operators, triggers) once, at startup,
        # so a changed operator isn't seen until they restart, and a DAG that
        # uses its new arguments fails to import. A provision's new revisions can
        # start before the upload, so restart after it either way. Tasks running
        # in the scheduler's container are cut off; deferred ones aren't.
        # Setting the commit and version (Datadog Source Code Integration and
        # Deployment Tracking) makes a new revision, which restarts them; if the
        # provision already set them, restart instead. Only the three keys that
        # follow the commit are rewritten, in place, so the rest of the value stays
        # as the Bicep set it and a later provision of this commit changes nothing.
        if: needs.plan.outputs.plugins_changed == 'true'
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX || 'aflo' }}
        run: |
          for app in dag-processor scheduler triggerer; do
            name="$NAME_PREFIX-$app"
            app_json="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$name" -o json)"
            current="$(jq -r '.properties.template.containers[0].env[] | select(.name == "OTEL_RESOURCE_ATTRIBUTES") | .value' <<<"$app_json")"
            desired="$current"
            if [ -n "$current" ]; then
              # service.version is <airflow version>-<short commit>, as in the
              # Bicep's airflowServiceVersion; the Airflow version is the image tag.
              image="$(jq -r '.properties.template.containers[0].image' <<<"$app_json")"
              desired="$(awk -v attrs="$current" -v version="${image##*:}-${GITHUB_SHA:0:7}" -v sha="$GITHUB_SHA" 'BEGIN {
                set["service.version"] = version; set["vcs.ref.head.revision"] = sha; set["git.commit.sha"] = sha
                n = split(attrs, pairs, ",")
                for (i = 1; i <= n; i++) {
                  key = substr(pairs[i], 1, index(pairs[i], "=") - 1)
                  if (key in set) { pairs[i] = key "=" set[key]; delete set[key] }
                  out = out (i > 1 ? "," : "") pairs[i]
                }
                for (key in set) out = out "," key "=" set[key]
                print out
              }')"
            fi
            if [ "$current" != "$desired" ]; then
              az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$name" --set-env-vars "OTEL_RESOURCE_ATTRIBUTES=$desired" -o none
              echo "Restarted $name on a new revision for $GITHUB_SHA"
            else
              revision="$(jq -r '.properties.latestRevisionName' <<<"$app_json")"
              az containerapp revision restart -g "$AZURE_RESOURCE_GROUP" -n "$name" --revision "$revision" -o none
              echo "Restarted $name ($revision)"
            fi
          done

      - name: Restart the stream services
        # They read their code from the share only at startup. Setting the
        # commit and version (Datadog Source Code Integration and Deployment
        # Tracking; DD_VERSION is the short commit, as in the Bicep's ddGitEnv)
        # makes a new revision, which restarts them; if the provision already set
        # them, restart instead.
        if: needs.plan.outputs.services_changed == 'true' && vars.ENABLE_ORDER_STREAM == 'true'
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX || 'aflo' }}
        run: |
          for app in storefront order-processor; do
            name="$NAME_PREFIX-$app"
            current="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$name" \
              --query "properties.template.containers[0].env[?name=='DD_GIT_COMMIT_SHA'].value | [0]" -o tsv)"
            if [ "$current" != "$GITHUB_SHA" ]; then
              az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$name" --set-env-vars "DD_GIT_COMMIT_SHA=$GITHUB_SHA" "DD_VERSION=${GITHUB_SHA:0:7}" -o none
              echo "Restarted $name on a new revision for $GITHUB_SHA"
            else
              revision="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$name" --query properties.latestRevisionName -o tsv)"
              az containerapp revision restart -g "$AZURE_RESOURCE_GROUP" -n "$name" --revision "$revision" -o none
              echo "Restarted $name ($revision)"
            fi
          done
