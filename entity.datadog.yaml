---
# The order stream: two Container Apps running services/ under ddtrace-run.
apiVersion: v3
kind: service
metadata:
  name: contoso-storefront
  displayName: Contoso storefront
  description: Generates orders and produces them to Event Hubs' Kafka endpoint.
  links:
    - name: Service code
      type: repo
      provider: github
      url: https://github.com/kyletaylored/airflow-aca-datadog/blob/main/services/storefront.py
    - name: Container App (Bicep)
